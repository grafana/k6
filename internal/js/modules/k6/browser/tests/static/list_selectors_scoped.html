<!DOCTYPE html>
<html>
<head>
  <title>List selectors in a locator</title>
</head>
<body>
  <button data-check="outside">Close</button>
  <div role="dialog" aria-label="Cart">
    <h2>Your cart</h2>
    <button data-check="close">Close</button>
    <button data-check="checkout">Checkout</button>
    <iframe title="Promo" srcdoc='<a href="#promo" data-check="promo">Promo</a>'></iframe>
  </div>
  <section>One</section>
  <section>Two</section>
</body>
</html>
