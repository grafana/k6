# Fork PR events cannot access secrets. Pass metadata to backport.yml through workflow_run.
name: Backport (trigger)
on:
  pull_request:
    branches: [master]
    types:
      - closed
      - labeled

permissions: {}

jobs:
  trigger:
    # Only run this job if the PR has been merged and has a label containing "backport "
    if: |
      github.repository == 'grafana/k6' &&
      github.event.pull_request.merged == true &&
      contains(join(github.event.pull_request.labels.*.name, ','), 'backport ') &&
      (github.event.action == 'closed' || startsWith(github.event.label.name, 'backport '))
    runs-on: ubuntu-latest
    steps:
      # TODO: save this as job summary instead?
      - name: Trigger
        run: |
          echo "Triggering workflow"
          echo "See https://github.com/${{ github.repository }}/actions/workflows/backport.yml for progress"

      # Create a JSON artifact with details of this PR to pass to the backport workflow.
      # The { action: 'labeled', label: 'backport v1.x' } can only be determined from this event payload,
      # and is needed to do a backport after a PR has been merged
      #
      # Important that we don't run *anything* from the PR which could modify the pr_info.json file
      - name: Create action data
        run: |
          jq '{
            action: .action,
            label: .label.name,
            pr_number: .number,
          }' "$GITHUB_EVENT_PATH" > /tmp/pr_info.json

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr_info
          path: /tmp/pr_info.json
          retention-days: 1
