name: Close stale issues and PRs

on:
  schedule:
    - cron: "0 8 * * 1" # once per week, at 08:00 on Mondays

permissions:
  pull-requests: write
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Run stale action
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operations-per-run: 50
          ascending: true # process oldest issues/PRs first

          days-before-issue-stale: 365
          days-before-issue-close: 30
          stale-issue-label: stale
          exempt-issue-labels: keep,epic
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            activity in the last year. It will be closed in 30 days if no further activity occurs. Please
            feel free to leave a comment if you believe the issue is still relevant.
            Thank you for your contributions!
          close-issue-message: >
            This issue has been automatically closed because it has not had any further
            activity in the last 30 days. Thank you for your contributions!

          days-before-pr-stale: 61
          days-before-pr-close: 7
          stale-pr-label: stale
          exempt-pr-labels: keep,wip
          stale-pr-message: |
            This pull request has been automatically marked as stale because it has not had
            activity in the last two months. It will be closed in one week if no further activity occurs. Please
            feel free to give a status update or ping for review. Thank you for your contributions!
          close-pr-message: |
            Closing this pull request due to two months of inactivity after being marked stale. Thank you for your contributions!
